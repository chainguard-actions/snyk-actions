name: Test basic usage - install latest Snyk
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          snyk-version: latest
          os: Linux
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: version output is '$VERSION'"
      - name: Assert snyk binary is on PATH
        run: |
          if ! command -v snyk &>/dev/null; then
            echo "FAIL: snyk binary not found on PATH"
            exit 1
          fi
          echo "PASS: snyk found at $(command -v snyk)"
      - name: Assert snyk version matches output
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          ACTUAL_VERSION="$(snyk version)"
          echo "snyk version output: $ACTUAL_VERSION"
          echo "action output version: $VERSION"
          if [ "$ACTUAL_VERSION" != "$VERSION" ]; then
            echo "FAIL: snyk version '$ACTUAL_VERSION' does not match action output '$VERSION'"
            exit 1
          fi
          echo "PASS"
