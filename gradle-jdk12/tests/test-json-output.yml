name: Test json output flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with json output enabled
        id: action
        uses: .
        continue-on-error: true
        with:
          command: test
          json: true
          # No SNYK_TOKEN — Docker step will fail, which is expected

      - name: Assert action accepted json input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The deprecation warning step always runs.
          # The Docker step fails without a SNYK_TOKEN, so failure is acceptable.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action accepted json=true input and produced outcome ($OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
