name: Test deprecation warning
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action (expect deprecation warning, Docker step may fail without token)
        id: action
        uses: .
        continue-on-error: true
        with:
          command: test
          args: --help

      - name: Assert action ran (deprecation warning step always executes)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action always emits a deprecation warning before the Docker step.
          # Without a SNYK_TOKEN the Docker step will fail, which is expected.
          # We only assert the action did not produce an unexpected outcome.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a deterministic outcome ($OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
