name: Test snyk with custom args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run snyk version with --version flag via args
        id: action
        uses: .
        with:
          command: version
          args: ""
        continue-on-error: true
      - name: Assert action ran with custom args
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: snyk version with args ran successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (container executed, may fail due to environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
