name: Test basic usage (snyk test)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Snyk action (expect failure without valid SNYK_TOKEN)
        id: action
        uses: .
        continue-on-error: true
        env:
          SNYK_TOKEN: "invalid-token-for-testing"
        with:
          command: test

      - name: Assert action ran and produced a recognizable outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without valid SNYK_TOKEN)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
