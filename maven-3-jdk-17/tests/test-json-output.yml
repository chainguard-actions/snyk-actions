name: Test Snyk Maven action - json output option
on:
  workflow_dispatch:
jobs:
  test-json-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Snyk test with json output enabled
        id: snyk-json
        uses: .
        with:
          command: test
          json: true
        continue-on-error: true

      - name: Assert action ran (json output or graceful failure)
        env:
          OUTCOME: ${{ steps.snyk-json.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: snyk test with json output succeeded"
            if [ -f "$GITHUB_WORKSPACE/snyk.json" ]; then
              echo "PASS: snyk.json output file was created"
            else
              echo "INFO: snyk.json not found (may not be created without a Maven project)"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without SNYK_TOKEN or Maven project)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
