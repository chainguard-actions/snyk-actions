name: Test Snyk Maven action - monitor command
on:
  workflow_dispatch:
jobs:
  test-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Snyk monitor command
        id: snyk-monitor
        uses: .
        with:
          command: monitor
          args: --help
        continue-on-error: true

      - name: Assert action ran (monitor command with --help or graceful failure)
        env:
          OUTCOME: ${{ steps.snyk-monitor.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: snyk monitor --help succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without SNYK_TOKEN or Maven project)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
