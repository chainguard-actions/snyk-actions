name: Test json input flag is accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with json=true input
        id: action
        uses: .
        continue-on-error: true
        with:
          command: test
          json: "true"
          args: "--help"

      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The composite action should accept the json=true input without
          # crashing at the action-level (before the docker step).
          # Failure is expected since no SNYK_TOKEN is set.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome '$OUTCOME' (failure is expected without a token)"
