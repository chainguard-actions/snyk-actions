name: Test deprecation warning is shown
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with version command to avoid needing a real token
        id: action
        uses: .
        continue-on-error: true
        with:
          command: version
          args: ""

      - name: Assert action ran (deprecation warning step always executes)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed (snyk version printed) or fail
          # gracefully. What matters is it ran (not skipped).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with outcome '$OUTCOME'"
