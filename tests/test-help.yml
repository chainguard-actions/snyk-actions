name: Test Snyk help command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: snyk-help
        uses: .
        with:
          command: help
        continue-on-error: true
      - name: Assert snyk help ran
        env:
          OUTCOME: ${{ steps.snyk-help.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: snyk help ran successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: snyk help ran (action executed, may exit non-zero)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
