name: Test snyk args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run snyk with --version arg
        id: action
        uses: .
        with:
          command: version
          args: ""
        continue-on-error: true
      - name: Assert action ran with args input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should run (success or graceful failure) — not crash
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: snyk ran successfully with args input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and exited (may fail due to environment, but args were forwarded)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
