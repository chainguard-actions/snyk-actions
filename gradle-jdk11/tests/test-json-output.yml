name: Test json output flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with json output enabled
        id: action
        uses: .
        continue-on-error: true
        env:
          SNYK_TOKEN: dummy-token-for-test
        with:
          command: test
          json: true
          args: --help

      - name: Assert action ran with json flag
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action accepts a 'json' input (default: false).
          # Without a real SNYK_TOKEN, the Snyk step will fail — that is acceptable here.
          # We verify the action ran (not skipped or errored in an unexpected way).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with json=true (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
