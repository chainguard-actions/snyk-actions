name: Test basic usage - deprecation warning
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action (Snyk scan expected to fail without valid token)
        id: action
        uses: .
        continue-on-error: true
        env:
          SNYK_TOKEN: dummy-token-for-test
        with:
          command: test
          args: --version

      - name: Assert action ran (deprecation warning was emitted, Snyk may fail without real token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to either succeed or fail gracefully.
          # The deprecation warning step always runs before the Snyk step.
          # Without a real SNYK_TOKEN, the Snyk step will fail — that is acceptable here.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
