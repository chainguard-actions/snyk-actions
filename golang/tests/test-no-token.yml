name: Test snyk test without token fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal Go project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/goapp"
          cat > "$GITHUB_WORKSPACE/goapp/go.mod" << 'EOF'
          module example.com/testapp

          go 1.21
          EOF
          cat > "$GITHUB_WORKSPACE/goapp/main.go" << 'EOF'
          package main

          func main() {}
          EOF
      - id: snyk-test
        uses: .
        with:
          command: test
          args: --severity-threshold=high
        continue-on-error: true
      - name: Assert action ran (fails gracefully without token)
        env:
          OUTCOME: ${{ steps.snyk-test.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: snyk test succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: snyk test failed gracefully (expected without valid SNYK_TOKEN)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
