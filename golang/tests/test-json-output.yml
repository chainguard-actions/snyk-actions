name: Test snyk json output option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal Go project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/goapp"
          cat > "$GITHUB_WORKSPACE/goapp/go.mod" << 'EOF'
          module example.com/testapp

          go 1.21
          EOF
          cat > "$GITHUB_WORKSPACE/goapp/main.go" << 'EOF'
          package main

          func main() {}
          EOF
      - id: snyk-json
        uses: .
        with:
          command: test
          json: true
        continue-on-error: true
      - name: Assert action ran with json option
        env:
          OUTCOME: ${{ steps.snyk-json.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should run (success or graceful failure without token)
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: snyk test with json=true succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: snyk test with json=true ran (expected failure without valid SNYK_TOKEN)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
