name: Test snyk with help args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: help
        continue-on-error: true
      - name: Assert help command ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # snyk help should succeed without authentication
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: snyk help command succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: snyk help ran (action executed correctly, outcome may vary by snyk version)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
