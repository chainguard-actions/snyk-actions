name: Test snyk test command without token (graceful failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: test
        continue-on-error: true
      - name: Assert action ran and failed gracefully without SNYK_TOKEN
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Without a SNYK_TOKEN, snyk test should fail with an auth error,
          # not crash the runner or produce an unexpected outcome.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected without SNYK_TOKEN"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (token may have been available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
