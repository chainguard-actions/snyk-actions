name: Test snyk version command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: version
        continue-on-error: true
      - name: Assert version command ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: snyk version command succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: snyk version command ran (may fail without token, but action executed)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
