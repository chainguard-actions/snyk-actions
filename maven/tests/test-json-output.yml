name: Test snyk with json output option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: test
          args: --json
          json: true
        continue-on-error: true
      - name: Assert action ran with json flag
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Without SNYK_TOKEN the test will fail, but the action should
          # have been invoked correctly with the json flag wired through.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with json args (failed gracefully without SNYK_TOKEN)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with json output"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
