name: Test basic usage - deprecation warning and scan attempt
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Assert SNYK_TOKEN is not set (expected in harness)
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "SNYK_TOKEN is set — Snyk scan may succeed"
          else
            echo "SNYK_TOKEN is not set — Snyk scan will fail (expected in harness)"
          fi

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: test
          args: --help
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Assert action ran (deprecation warning emitted, scan attempted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (SNYK_TOKEN was available)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (SNYK_TOKEN not available or scan failed as expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
