name: Test json output flag input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke action with json=true (expect failure without SNYK_TOKEN)
        id: action
        uses: .
        continue-on-error: true
        with:
          command: test
          json: true

      - name: Assert action ran with json flag (scan failed gracefully without token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail at the Docker/Snyk step.
          # It must not be skipped — the composite action must have been invoked.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with json=true"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without SNYK_TOKEN)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
