name: Test basic usage - deprecation warning and graceful failure without token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke action (expect failure without SNYK_TOKEN)
        id: action
        uses: .
        continue-on-error: true
        with:
          command: test
          args: --help

      - name: Assert action ran (deprecation warning shown, scan failed gracefully without token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed (if token somehow available) or fail
          # gracefully at the Docker/Snyk step. It must not be skipped.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without SNYK_TOKEN)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
