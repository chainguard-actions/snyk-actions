name: Test json output flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: test
          args: --help
          json: true
        continue-on-error: true
      - name: Assert action ran with json flag
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should run (json flag is passed as an input, not a snyk arg directly)
          # snyk test --help should succeed or fail gracefully
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran successfully with json=true"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (expected without SNYK_TOKEN)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
