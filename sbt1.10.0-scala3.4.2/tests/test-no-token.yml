name: Test snyk test without token - graceful failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: test
          args: --help
        continue-on-error: true
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # snyk test --help should succeed (no auth needed for help)
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: snyk test --help ran successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (expected without SNYK_TOKEN)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
