name: Test basic usage - deprecation warning and snyk test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal Python project for Snyk to scan
        run: |
          mkdir -p tests/fixtures/python-project
          cat > tests/fixtures/python-project/requirements.txt << 'EOF'
          requests==2.28.0
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --file=tests/fixtures/python-project/requirements.txt --package-manager=pip

      - name: Assert action ran (deprecation warning shown, Snyk step ran or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: Snyk scan completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (expected without valid SNYK_TOKEN or real project)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
