name: Test json output flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with json output enabled
        id: action
        uses: .
        continue-on-error: true
        with:
          command: test
          json: "true"
          args: "--severity-threshold=critical"

      - name: Assert action ran with json flag
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Without a valid SNYK_TOKEN the scan will fail, but the action should
          # have been invoked with the correct arguments (json flag + args).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with json output flag"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (no SNYK_TOKEN in test env)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
