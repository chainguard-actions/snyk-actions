name: Test basic usage - deprecation warning
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with version command (no auth needed)
        id: action
        uses: .
        continue-on-error: true
        with:
          command: version
          args: ""

      - name: Assert action ran (deprecation warning shown, snyk version attempted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed (snyk version ran) or fail gracefully
          # (docker pull issue, etc.). What matters is it ran and didn't skip.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded - snyk version ran"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (expected without full env)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
