name: Test basic Snyk IaC usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create IaC test file
        run: |
          mkdir -p /tmp/iac-test
          cat > /tmp/iac-test/main.tf <<'EOF'
          resource "aws_s3_bucket" "example" {
            bucket = "my-test-bucket"
          }
          EOF

      - id: snyk-iac
        uses: .
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          file: tests/fixtures/main.tf
          sarif: false
          json: false

      - name: Assert action ran (succeeded or failed gracefully without token)
        env:
          OUTCOME: ${{ steps.snyk-iac.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: Snyk IaC test completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without valid SNYK_TOKEN or due to IaC findings)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
