name: Test Snyk IaC SARIF output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: snyk-iac-sarif
        uses: .
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          file: tests/fixtures/main.tf
          sarif: true
          json: false

      - name: Assert action ran with sarif output mode (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.snyk-iac-sarif.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: Snyk IaC test with sarif=true completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without valid SNYK_TOKEN or due to IaC findings)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
