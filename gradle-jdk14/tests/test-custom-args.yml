name: Test custom args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with custom command and args
        id: action
        uses: .
        with:
          command: test
          args: "--help"
        # --help exits 0 on most CLIs but Snyk may still require auth;
        # use continue-on-error so the assertion step always runs.
        continue-on-error: true

      - name: Assert action accepted custom args
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should have been invoked with 'snyk test --help'.
          # Snyk may exit non-zero without a token even for --help, so both
          # success and failure are acceptable outcomes — what we verify is
          # that the action was invoked (not skipped) and did not produce an
          # unexpected runner-level error.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with custom args (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
