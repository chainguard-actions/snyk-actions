name: Test json output input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with json output enabled
        id: action
        uses: .
        with:
          command: test
          json: "true"
        # Without a SNYK_TOKEN the scan will fail with an auth error.
        # continue-on-error lets the assertion step always execute.
        continue-on-error: true

      - name: Assert action accepted json input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should have been invoked with json=true.
          # Without a real SNYK_TOKEN the Snyk step will fail with an
          # authentication error, which is expected in this harness.
          # We verify the action was invoked (not skipped) and did not
          # produce an unexpected runner-level error.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with json=true (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
