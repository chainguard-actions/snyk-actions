name: Test deprecation warning
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Capture deprecation warning output
        id: action
        uses: .
        with:
          command: version
          args: ""
        continue-on-error: true

      - name: Assert action ran (deprecation warning step always executes)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action always emits a deprecation warning before the Snyk step.
          # Without a SNYK_TOKEN the Snyk step will fail, but the warning step
          # always runs first. Either outcome (success or failure) is acceptable
          # here — what matters is that the action was invoked and did not skip.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
