name: Test snyk version command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: version

      - name: Assert action ran with version command
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # snyk version command should succeed without a token or project
          # It just prints the installed snyk version
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: snyk version command succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran but failed (acceptable in harness without real token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
