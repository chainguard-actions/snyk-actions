name: Test basic snyk test (no token - graceful failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal Python project for Snyk to scan
        run: |
          mkdir -p /tmp/snyk-test-project
          cat > /tmp/snyk-test-project/requirements.txt <<'EOF'
          requests==2.28.0
          EOF

      - id: snyk
        uses: .
        continue-on-error: true
        with:
          command: test
          args: --file=/tmp/snyk-test-project/requirements.txt
        env:
          SNYK_TOKEN: ""

      - name: Assert action ran (fails gracefully without a valid SNYK_TOKEN)
        env:
          OUTCOME: ${{ steps.snyk.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no valid SNYK_TOKEN)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
