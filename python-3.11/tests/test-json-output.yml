name: Test snyk test with json output flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: snyk
        uses: .
        continue-on-error: true
        with:
          command: test
          json: true
          args: --help
        env:
          SNYK_TOKEN: ""

      - name: Assert action ran with json flag (fails gracefully without SNYK_TOKEN)
        env:
          OUTCOME: ${{ steps.snyk.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no valid SNYK_TOKEN or expected failure)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with json flag"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
