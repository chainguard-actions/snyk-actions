name: Test command input is passed through
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run snyk with custom command (auth with fake token)
        id: action
        uses: .
        with:
          command: auth
          args: fake-token-for-testing
        continue-on-error: true
      - name: Assert action ran with custom command
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # snyk auth with a fake token will fail, but the container must have executed
          # and the command must have been passed through correctly
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: snyk auth succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with custom command (auth failed as expected with fake token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
