name: Test snyk default test command (no token)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        # No SNYK_TOKEN provided — action should fail gracefully with auth error
        continue-on-error: true
      - name: Assert action failed gracefully without token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no SNYK_TOKEN)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (token may have been available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
