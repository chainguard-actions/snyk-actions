name: Test snyk test with json output flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: test
          json: true
        # Without SNYK_TOKEN the test command will fail with auth error
        continue-on-error: true
      - name: Assert action ran with json flag
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (no SNYK_TOKEN, json flag accepted)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with json flag"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
